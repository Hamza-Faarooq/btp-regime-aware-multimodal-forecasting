name: Compile BTP LaTeX report

on:
  workflow_dispatch:
  push:
    paths:
      - "report/latex/**"
      - ".github/workflows/compile-btp-report.yml"

permissions:
  contents: read

jobs:
  compile-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile report
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: report/latex
          root_file: main.tex
          latexmk_use_xelatex: false
          latexmk_shell_escape: false

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: BTP-Report-PDF
          path: report/latex/main.pdf
          if-no-files-found: error
